name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  semver:
    name: Semver
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          package: sql-scalar-text

  verify:
    name: Verify
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --release --all-features
      - run: cargo test --release --doc --all-features
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo check --target wasm32-unknown-unknown --no-default-features
      - run: cargo check --target wasm32-unknown-unknown --all-features

  fuzz:
    name: Fuzz Smoke
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - run: cd fuzz && cargo +nightly fuzz run fuzz_timestamp -- -dict=sql_scalars.dict -max_len=100 -runs=100
      - run: cd fuzz && cargo +nightly fuzz run fuzz_timestamp_tz -- -dict=sql_scalars.dict -max_len=100 -runs=100
      - run: cd fuzz && cargo +nightly fuzz run fuzz_date -- -dict=sql_scalars.dict -max_len=100 -runs=100
      - run: cd fuzz && cargo +nightly fuzz run fuzz_time -- -dict=sql_scalars.dict -max_len=100 -runs=100
      - run: cd fuzz && cargo +nightly fuzz run fuzz_bool -- -dict=sql_scalars.dict -max_len=100 -runs=100
      - run: cd fuzz && cargo +nightly fuzz run fuzz_pg_bytea_hex -- -dict=sql_scalars.dict -max_len=100 -runs=100
      - run: cd fuzz && cargo +nightly fuzz run fuzz_i64 -- -dict=sql_scalars.dict -max_len=100 -runs=100
      - run: cd fuzz && cargo +nightly fuzz run fuzz_f64 -- -dict=sql_scalars.dict -max_len=100 -runs=100
      - run: cd fuzz && cargo +nightly fuzz run fuzz_decimal -- -dict=sql_scalars.dict -max_len=100 -runs=100
  msrv:
    name: Rust 1.88
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --all-features
