[package]
name = "sql-values"
version = "0.5.1"
edition = "2024"
rust-version = "1.88"
authors = ["Luca Cappelletti"]
license = "MIT"
description = "SQL values, with PostgreSQL's value rules beside readers of the text PostgreSQL, MySQL and SQLite emit"
repository = "https://github.com/connetto-rs/sql-values"
readme = "README.md"
keywords = ["sql", "parser", "postgresql", "mysql", "sqlite"]
categories = ["database", "parser-implementations", "no-std"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
decimal = ["dep:bigdecimal"]
jiff = []
serde = ["dep:serde"]

[dependencies]
bigdecimal = { version = "0.4", default-features = false, optional = true }
jiff = { version = "0.2.39", default-features = false, features = ["alloc", "tzdb-bundle-always"] }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
thiserror = { version = "2", default-features = false }

[build-dependencies]
thiserror = { version = "2", default-features = false }

[dev-dependencies]
testcontainers = { version = "0.27", features = ["blocking"] }
testcontainers-modules = { version = "0.15", features = ["postgres", "mysql", "blocking"] }
diesel = { version = "2.3", features = ["postgres", "mysql", "sqlite"] }
proptest = "1.11"
criterion = { version = "0.8", features = ["html_reports"] }
parking_lot = "0.12.5"

[[bench]]
name = "scalar_parsing"
harness = false
