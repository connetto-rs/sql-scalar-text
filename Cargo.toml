[package]
name = "sql-scalar-text"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["Luca Cappelletti"]
license = "MIT"
description = "Parse SQL scalar text from PostgreSQL, MySQL, and SQLite"
repository = "https://github.com/connetto-rs/sql-scalar-text"
readme = "README.md"
keywords = ["sql", "parser", "postgresql", "mysql", "sqlite"]
categories = ["database", "parser-implementations", "no-std"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
decimal = ["dep:bigdecimal"]

[dependencies]
bigdecimal = { version = "0.4", default-features = false, optional = true }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
testcontainers = { version = "0.27", features = ["blocking"] }
testcontainers-modules = { version = "0.15", features = ["postgres", "mysql", "blocking"] }
diesel = { version = "2.3", features = ["postgres", "mysql", "sqlite"] }
proptest = "1.11"
criterion = { version = "0.8", features = ["html_reports"] }
parking_lot = "0.12.5"

[[bench]]
name = "scalar_parsing"
harness = false
